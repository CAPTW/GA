services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker-data/minio:/data

  ops-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m uvicorn ga_ops.app:app --host 0.0.0.0 --port 8000
    environment:
      GA_LAB_OPS_DB_PATH: /app/var/ops/ga_ops.db
      GA_LAB_OBJECT_STORE_PROVIDER: s3
      GA_LAB_OBJECT_STORE_BUCKET: ga-lab-artifacts
      GA_LAB_S3_ENDPOINT_URL: http://minio:9000
      GA_LAB_S3_REGION: us-east-1
      GA_LAB_S3_ACCESS_KEY_ID: minioadmin
      GA_LAB_S3_SECRET_ACCESS_KEY: minioadmin
      GA_LAB_OPS_ADMIN_TOKEN: change-me
      GA_LAB_SCHEDULER_JOBS_PATH: /app/configs/schedules/default_jobs.json
      GA_LAB_SCHEDULER_TIMEZONE: Asia/Seoul
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./outputs_test:/app/outputs_test
      - ./var:/app/var
    depends_on:
      - minio

  ops-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m streamlit run scripts/ops_dashboard.py --server.address 0.0.0.0 --server.port 8502
    environment:
      GA_LAB_OPS_DB_PATH: /app/var/ops/ga_ops.db
      GA_LAB_OBJECT_STORE_PROVIDER: s3
      GA_LAB_OBJECT_STORE_BUCKET: ga-lab-artifacts
      GA_LAB_S3_ENDPOINT_URL: http://minio:9000
      GA_LAB_S3_REGION: us-east-1
      GA_LAB_S3_ACCESS_KEY_ID: minioadmin
      GA_LAB_S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8502:8502"
    volumes:
      - ./outputs:/app/outputs
      - ./outputs_test:/app/outputs_test
      - ./var:/app/var
    depends_on:
      - ops-api

  ops-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python scripts/run_ops_scheduler.py
    environment:
      GA_LAB_OPS_DB_PATH: /app/var/ops/ga_ops.db
      GA_LAB_OBJECT_STORE_PROVIDER: s3
      GA_LAB_OBJECT_STORE_BUCKET: ga-lab-artifacts
      GA_LAB_S3_ENDPOINT_URL: http://minio:9000
      GA_LAB_S3_REGION: us-east-1
      GA_LAB_S3_ACCESS_KEY_ID: minioadmin
      GA_LAB_S3_SECRET_ACCESS_KEY: minioadmin
      GA_LAB_SCHEDULER_JOBS_PATH: /app/configs/schedules/default_jobs.json
      GA_LAB_SCHEDULER_TIMEZONE: Asia/Seoul
    volumes:
      - ./outputs:/app/outputs
      - ./outputs_test:/app/outputs_test
      - ./var:/app/var
    depends_on:
      - minio
