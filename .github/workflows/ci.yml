name: ci

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  changes:
    name: Detect non-workflow changes
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.scope.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed_paths="$(git show --pretty='' --name-only "$head")"
          else
            changed_paths="$(git diff --name-only "$base" "$head")"
          fi

          printf 'Changed paths:\n%s\n' "$changed_paths"

          repository_changed=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              .github/workflows/*) ;;
              *)
                repository_changed=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          echo "repository=$repository_changed" >> "$GITHUB_OUTPUT"

  workflow-smoke:
    name: Workflow actions smoke
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create workflow smoke artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/workflow-smoke
          {
            echo "checkout=actions/checkout@v7"
            echo "setup-python=actions/setup-python@v7"
            python --version
          } > .ci-artifacts/workflow-smoke/actions.txt
      - name: Upload workflow smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-workflow-smoke
          path: .ci-artifacts/workflow-smoke
          retention-days: 14

  lint:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/lint
          status=0
          python -m ruff check src tests scripts services 2>&1 | tee .ci-artifacts/lint/ruff-check.log || status=$?
          python -m ruff format --check src tests scripts services 2>&1 | tee .ci-artifacts/lint/ruff-format.log || status=$?
          exit "$status"
      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-lint
          path: .ci-artifacts/lint
          retention-days: 14

  typecheck:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: MyPy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/typecheck
          python -m mypy src 2>&1 | tee .ci-artifacts/typecheck/mypy.log
      - name: Upload typecheck artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-typecheck
          path: .ci-artifacts/typecheck
          retention-days: 14

  test:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/test
          python -m pytest --junitxml .ci-artifacts/test/pytest.xml 2>&1 | tee .ci-artifacts/test/pytest.log
      - name: Public API snapshot check
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_public_api.py 2>&1 | tee .ci-artifacts/test/public-api.log
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test
          path: .ci-artifacts/test
          retention-days: 14

  baseline-regression:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Baseline regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/baseline-regression
          python -m pytest tests/test_baseline_regression.py --junitxml .ci-artifacts/baseline-regression/pytest.xml 2>&1 | tee .ci-artifacts/baseline-regression/pytest.log
      - name: Upload baseline regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-baseline-regression
          path: .ci-artifacts/baseline-regression
          retention-days: 14

  benchmark-smoke:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Benchmark smoke suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/benchmark-smoke
          python scripts/run_ci_benchmarks.py --tier tier1 --output-root .ci-artifacts/benchmark-smoke 2>&1 | tee .ci-artifacts/benchmark-smoke/benchmark-smoke.log
          find .ci-artifacts/benchmark-smoke -maxdepth 4 -type f | sort > .ci-artifacts/benchmark-smoke/files.txt
      - name: Upload benchmark smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-benchmark-smoke
          path: .ci-artifacts/benchmark-smoke
          retention-days: 14

  portable-smoke:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel
        run: python -m build
      - name: Portable wheel smoke
        run: |
          python scripts/package_portability_smoke.py --dist-dir dist --output-root .ci-artifacts/portable-smoke
      - name: Upload portable smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-smoke-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .ci-artifacts/portable-smoke
          retention-days: 14

  governance:
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Governance tier 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-artifacts/governance
          python scripts/run_ci_benchmarks.py --tier tier0 --output-root .ci-artifacts/governance 2>&1 | tee .ci-artifacts/governance/governance.log
      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-governance
          path: .ci-artifacts/governance
          retention-days: 14
