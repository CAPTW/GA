name: codex-review

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  codex:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@codex review') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review the GA research repository. Focus on correctness, reproducibility,
            and whether experiments are validated by tests.
