[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-solver-benchmark-lab"
version = "0.1.0"
description = "Evidence-backed GA and solver-choice lab with reproducible benchmark governance."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CAPTW"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
ga-lab-run = "ga_lab.entrypoints:run_experiment_entrypoint"
ga-lab-recommend-preset = "ga_lab.entrypoints:recommend_preset_entrypoint"
ga-lab-recommend-solver = "ga_lab.entrypoints:recommend_solver_entrypoint"
ga-lab-check-claims = "ga_lab.entrypoints:check_claims_entrypoint"
ga-lab-render-release-artifacts = "ga_lab.entrypoints:render_release_artifacts_entrypoint"
ga-lab-demo = "ga_lab.entrypoints:demo_entrypoint"

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff==0.15.5", "mypy==1.19.1", "matplotlib>=3.8"]
mo-compare = ["pymoo>=0.6", "deap>=1.4"]
release = ["build>=1.2", "twine>=5.1"]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "altair>=5.0"]
tracking = ["mlflow==3.10.1", "wandb==0.25.0"]
jupyter = ["jupyterlab>=4.3", "ipykernel>=6.29", "pandas>=2.0"]
ops = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "apscheduler>=3.11",
  "boto3>=1.37",
  "streamlit>=1.35",
  "pandas>=2.0",
  "altair>=5.0",
  "python-dotenv>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
ga_lab = [
  "builtin_resources/presets/*.json",
  "builtin_resources/demo/*.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "services"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
pretty = true
show_error_codes = true
